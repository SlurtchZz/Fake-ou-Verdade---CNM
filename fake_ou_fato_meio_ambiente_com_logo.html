<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fake ou Fato — Meio Ambiente</title>
<style>
  :root {
    --green: #176b45;
    --green2: #2e9d68;
    --light: #eef8f2;
    --text: #17352a;
    --white: #fff;
    --red: #c94b4b;
    --shadow: 0 12px 35px rgba(23,107,69,.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #eaf8ef, #f7fcf8);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, #125b3a, #2e9d68);
    color: white;
    text-align: center;
    padding: 42px 20px 55px;
  }
  header h1 { margin: 0 0 8px; font-size: clamp(2rem, 5vw, 3.5rem); }
  header p { margin: 0 auto; max-width: 700px; opacity: .92; font-size: 1.05rem; }
  .container { width: min(920px, 92%); margin: -28px auto 50px; }
  .card {
    background: var(--white);
    border-radius: 22px;
    padding: 28px;
    box-shadow: var(--shadow);
  }
  .top {
    display: flex; justify-content: space-between; gap: 20px; align-items: center;
    margin-bottom: 18px; flex-wrap: wrap;
  }
  .progress-wrap { flex: 1; min-width: 220px; }
  .progress-text { font-weight: 700; margin-bottom: 8px; }
  .progress { height: 10px; background: #dceee4; border-radius: 99px; overflow: hidden; }
  .bar { height: 100%; width: 0%; background: var(--green2); transition: width .3s; }
  .score { font-weight: 800; color: var(--green); }
  .question {
    font-size: clamp(1.35rem, 3vw, 1.8rem);
    line-height: 1.35;
    margin: 24px 0;
  }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  button {
    border: 0; border-radius: 15px; padding: 16px 18px; font-size: 1rem;
    font-weight: 800; cursor: pointer; transition: transform .15s, box-shadow .15s, opacity .15s;
  }
  .option {
    background: var(--light); color: var(--green); border: 2px solid #d4ecde;
  }
  .option:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 7px 18px rgba(23,107,69,.12); }
  button:disabled { cursor: default; }
  .correct { background: #dff5e7 !important; border-color: #42a66d !important; color: #145b38 !important; }
  .wrong { background: #fde7e7 !important; border-color: #d76b6b !important; color: #8f2929 !important; }
  .feedback {
    display: none; margin-top: 20px; padding: 17px; border-radius: 14px;
    background: #f4f8f5; line-height: 1.55;
  }
  .feedback strong { color: var(--green); }
  .next {
    display: none; margin-top: 18px; width: 100%; background: var(--green); color: white;
  }
  .next:hover { background: #0f5635; }
  .result { display: none; text-align: center; }
  .result .emoji { font-size: 4rem; }
  .result h2 { font-size: 2rem; color: var(--green); }
  .restart { background: var(--green); color: white; margin-top: 12px; }
  footer { text-align: center; padding: 10px 20px 35px; color: #557365; font-size: .9rem; }
  @media (max-width: 620px) {
    .options { grid-template-columns: 1fr; }
    .card { padding: 20px; }
  }

  .corner-logo {
    position: fixed;
    top: 14px;
    left: 14px;
    width: 84px;
    height: auto;
    z-index: 1000;
    object-fit: contain;
  }
  @media (max-width: 620px) {
    .corner-logo { width: 58px; top: 10px; left: 10px; }
    header { padding-top: 76px; }
  }

</style>
</head>
<body>
<img class="corner-logo" src="logo_nm_transparente.png" alt="Logo NM">
<header>
  <h1>🌎 Fake ou Fato?</h1>
  <p>Teste seus conhecimentos sobre meio ambiente, sustentabilidade e mudanças climáticas.</p>
</header>

<main class="container">
  <section class="card" id="quiz">
    <div class="top">
      <div class="progress-wrap">
        <div class="progress-text" id="progressText">Pergunta 1 de 15</div>
        <div class="progress"><div class="bar" id="bar"></div></div>
      </div>
      <div class="score" id="score">Acertos: 0</div>
    </div>

    <div id="questionArea">
      <div class="question" id="question"></div>
      <div class="options">
        <button class="option" onclick="answer(true)">✅ FATO</button>
        <button class="option" onclick="answer(false)">❌ FAKE</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <button class="next" id="next" onclick="nextQuestion()">Próxima pergunta →</button>
    </div>

    <div class="result" id="result">
      <div class="emoji" id="resultEmoji">🌱</div>
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
      <button class="restart" onclick="restart()">Jogar novamente</button>
    </div>
  </section>
</main>

<footer>Quiz educativo sobre meio ambiente • 15 perguntas</footer>

<script>
const questions = [
  {q:"Plantar árvores pode ajudar a retirar dióxido de carbono (CO₂) da atmosfera.", a:true, e:"As árvores absorvem CO₂ durante a fotossíntese e armazenam carbono em sua biomassa e no solo."},
  {q:"Reciclar significa que todo material descartado pode ser transformado novamente em qualquer outro produto.", a:false, e:"Nem todo material é reciclável ou pode ser reciclado indefinidamente. Isso depende do material, da tecnologia e da infraestrutura disponível."},
  {q:"A água do planeta está em um ciclo natural que inclui evaporação, condensação e precipitação.", a:true, e:"Esse processo é conhecido como ciclo da água e movimenta a água entre a atmosfera, a superfície e o subsolo."},
  {q:"O efeito estufa é um fenômeno totalmente artificial e não existiria sem a ação humana.", a:false, e:"O efeito estufa natural é essencial para manter a Terra habitável. A atividade humana intensifica esse efeito ao aumentar a concentração de gases de efeito estufa."},
  {q:"Economizar energia elétrica pode contribuir para reduzir impactos ambientais.", a:true, e:"Reduzir o consumo de energia evita parte da demanda por geração e, dependendo da fonte utilizada, pode diminuir emissões e outros impactos."},
  {q:"Todo plástico demora exatamente 100 anos para desaparecer na natureza.", a:false, e:"O tempo de degradação varia muito conforme o tipo de plástico e as condições ambientais. Não existe um prazo único de 100 anos para todos."},
  {q:"O desmatamento pode contribuir para a perda de biodiversidade.", a:true, e:"A remoção de habitats pode reduzir populações, fragmentar ecossistemas e ameaçar espécies."},
  {q:"Separar resíduos recicláveis dos demais resíduos facilita a reciclagem.", a:true, e:"A separação correta ajuda a manter materiais aproveitáveis em melhores condições e facilita etapas da coleta e triagem."},
  {q:"Usar água potável para lavar calçadas com mangueira é sempre a opção mais sustentável.", a:false, e:"Em geral, é melhor evitar desperdícios de água potável e usar métodos mais econômicos, como varrer e, quando apropriado, reutilizar água."},
  {q:"A energia solar é uma fonte de energia renovável.", a:true, e:"A energia solar utiliza a radiação do Sol, uma fonte que se renova continuamente em escala humana."},
  {q:"As mudanças climáticas atuais são causadas apenas por fenômenos naturais.", a:false, e:"Fenômenos naturais influenciam o clima, mas o aquecimento global observado nas últimas décadas é principalmente causado pelo aumento de gases de efeito estufa devido às atividades humanas."},
  {q:"A compostagem pode transformar restos orgânicos em um material que pode ser usado para melhorar o solo.", a:true, e:"A compostagem de resíduos orgânicos produz composto, que pode contribuir para a qualidade do solo quando utilizado adequadamente."},
  {q:"Jogar óleo de cozinha usado diretamente no ralo não causa problemas ambientais.", a:false, e:"O óleo pode causar entupimentos e dificultar o tratamento de esgoto. O ideal é armazená-lo e encaminhá-lo para coleta ou reciclagem adequada."},
  {q:"A biodiversidade inclui a variedade de espécies, genes e ecossistemas.", a:true, e:"Biodiversidade é um conceito amplo que abrange a diversidade dentro das espécies, entre espécies e dos ecossistemas."},
  {q:"Pequenas atitudes individuais nunca fazem diferença para o meio ambiente.", a:false, e:"Hábitos individuais podem contribuir, especialmente quando adotados por muitas pessoas. Além disso, ações coletivas, políticas públicas e mudanças em empresas também são importantes."}
];

let current = 0, score = 0, answered = false;

const qEl = document.getElementById("question");
const feedbackEl = document.getElementById("feedback");
const nextEl = document.getElementById("next");
const scoreEl = document.getElementById("score");
const progressText = document.getElementById("progressText");
const bar = document.getElementById("bar");

function loadQuestion() {
  answered = false;
  const item = questions[current];
  qEl.textContent = item.q;
  feedbackEl.style.display = "none";
  nextEl.style.display = "none";
  progressText.textContent = `Pergunta ${current + 1} de ${questions.length}`;
  bar.style.width = `${(current / questions.length) * 100}%`;
  document.querySelectorAll(".option").forEach(b => {
    b.disabled = false;
    b.classList.remove("correct", "wrong");
  });
}

function answer(value) {
  if (answered) return;
  answered = true;
  const item = questions[current];
  const buttons = document.querySelectorAll(".option");
  const chosen = value ? buttons[0] : buttons[1];
  const correctButton = item.a ? buttons[0] : buttons[1];

  buttons.forEach(b => b.disabled = true);
  correctButton.classList.add("correct");

  if (value === item.a) {
    score++;
    chosen.classList.add("correct");
    feedbackEl.innerHTML = `<strong>🎉 Acertou!</strong> ${item.e}`;
  } else {
    chosen.classList.add("wrong");
    feedbackEl.innerHTML = `<strong>💡 Não foi dessa vez.</strong> ${item.e}`;
  }

  scoreEl.textContent = `Acertos: ${score}`;
  feedbackEl.style.display = "block";
  nextEl.style.display = "block";
}

function nextQuestion() {
  current++;
  if (current < questions.length) loadQuestion();
  else showResult();
}

function showResult() {
  document.getElementById("questionArea").style.display = "none";
  document.querySelector(".top").style.display = "none";
  const result = document.getElementById("result");
  result.style.display = "block";
  bar.style.width = "100%";

  const pct = Math.round(score / questions.length * 100);
  let emoji = "🌱", title = "Continue aprendendo!";
  if (pct >= 90) { emoji = "🌳"; title = "Mandou muito bem!"; }
  else if (pct >= 70) { emoji = "🌿"; title = "Muito bom!"; }
  else if (pct >= 50) { emoji = "🌱"; title = "Bom começo!"; }
  else { emoji = "📚"; title = "Hora de aprender mais!"; }

  document.getElementById("resultEmoji").textContent = emoji;
  document.getElementById("resultTitle").textContent = title;
  document.getElementById("resultText").textContent =
    `Você acertou ${score} de ${questions.length} perguntas (${pct}%).`;
}

function restart() {
  current = 0; score = 0;
  document.querySelector(".top").style.display = "flex";
  document.getElementById("questionArea").style.display = "block";
  document.getElementById("result").style.display = "none";
  scoreEl.textContent = "Acertos: 0";
  loadQuestion();
}

loadQuestion();
</script>
</body>
</html>
